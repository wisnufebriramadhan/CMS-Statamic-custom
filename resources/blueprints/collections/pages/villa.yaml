title: Portofolio
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: page_description
            field:
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
                - h1
                - h4
                - h5
                - h6
                - alignleft
                - aligncenter
                - alignright
                - alignjustify
              save_html: true
              remove_empty_nodes: false
              type: bard
              display: 'Page Description'
          -
            handle: portofolio_list
            field:
              type: replicator
              display: 'Portofolio List'
              validate:
                - required
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    portofolio_item:
                      display: 'Portofolio Item'
                      fields:
                        -
                          handle: portofolio_title
                          field:
                            type: text
                            display: 'Portofolio Title'
                        -
                          handle: portofolio_description
                          field:
                            buttons:
                              - h2
                              - h3
                              - bold
                              - italic
                              - unorderedlist
                              - orderedlist
                              - removeformat
                              - quote
                              - anchor
                              - image
                              - table
                              - h1
                              - h4
                              - h5
                              - h6
                              - alignleft
                              - aligncenter
                              - alignright
                              - alignjustify
                            save_html: true
                            remove_empty_nodes: false
                            type: bard
                            display: 'Portofolio Description'
                        -
                          handle: portofolio_image
                          field:
                            max_files: 7
                            min_files: 1
                            container: assets
                            type: assets
                            display: 'Portofolio Image'
                            validate:
                              - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
          -
            handle: template
            field:
              type: template
              display: Template
              validate:
                - required
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
