<svg id="teras-depan-illustration" width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terasGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="terasGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="url(#terasGrad1)"/>
  
  <!-- House structure -->
  <path d="M 200 60 L 320 140 L 320 240 L 80 240 L 80 140 Z" fill="url(#terasGrad2)"/>
  
  <!-- Roof accent -->
  <path d="M 200 60 L 320 140 L 310 140 L 200 70 L 90 140 L 80 140 Z" fill="#1e40af" opacity="0.8"/>
  
  <!-- Door -->
  <rect x="170" y="180" width="60" height="60" rx="4" fill="white" opacity="0.3"/>
  <circle cx="220" cy="210" r="3" fill="#2563eb"/>
  
  <!-- Windows -->
  <rect x="100" y="160" width="50" height="50" rx="4" fill="white" opacity="0.25"/>
  <line x1="125" y1="160" x2="125" y2="210" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="185" x2="150" y2="185" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  
  <rect x="250" y="160" width="50" height="50" rx="4" fill="white" opacity="0.25"/>
  <line x1="275" y1="160" x2="275" y2="210" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="185" x2="300" y2="185" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  
  <!-- Plants -->
  <ellipse cx="140" cy="235" rx="15" ry="8" fill="#22c55e" opacity="0.6"/>
  <rect x="137" y="220" width="6" height="15" fill="#16a34a" opacity="0.5"/>
  
  <ellipse cx="260" cy="235" rx="15" ry="8" fill="#22c55e" opacity="0.6"/>
  <rect x="257" y="220" width="6" height="15" fill="#16a34a" opacity="0.5"/>
  
  <!-- Ground -->
  <rect x="60" y="240" width="280" height="4" fill="#2563eb" opacity="0.2" rx="2"/>
  
  <!-- Decorative elements -->
  <circle cx="340" cy="80" r="25" fill="#3b82f6" opacity="0.15"/>
  <circle cx="60" cy="200" r="30" fill="#2563eb" opacity="0.1"/>
</svg>